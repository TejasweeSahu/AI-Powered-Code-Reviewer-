services:
  - type: web
    name: ai-code-reviewer-backend
    runtime: node
    rootDir: BackEnd
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"
      - key: GOOGLE_GEMINI_KEY
        sync: false

